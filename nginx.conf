# Nginx configuration for DeliRealms/Vixle
# 1. Main app: reverse proxy to Next.js (next start on port 3000)
# 2. Deployments: each project deploys to subdomain.vixle.app -> localhost:PORT
#    The docker-service writes configs to /etc/nginx/sites-enabled/<subdomain>.conf
#    Include them via: include /etc/nginx/sites-enabled/*.conf;

# Deployment subdomain configs are written by docker-service to:
#   /etc/nginx/sites-enabled/<subdomain>.conf
# Ensure your main nginx.conf includes: include /etc/nginx/sites-enabled/*.conf;

upstream nextjs {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Redirect www to non-www
server {
    listen 80;
    listen [::]:80;
    server_name www.vixle.app;
    return 301 $scheme://vixle.app$request_uri;
}

# Main app - vixle.app (dashboard, auth, etc)
server {
    listen 80;
    listen [::]:80;
    server_name vixle.app;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /_next/static {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /static {
        proxy_pass http://nextjs;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Deployment subdomains - include configs generated by docker-service
# Each deployment creates: /etc/nginx/sites-enabled/<subdomain>.conf
# Example for subdomain "my-store":
#   server {
